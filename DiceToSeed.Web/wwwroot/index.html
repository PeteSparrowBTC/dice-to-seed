<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dice to seed</title>
    <!-- Every asset below is served from this folder. Bootstrap was deleted with the rest of
         the template's third-party assets rather than kept and excluded from checks: the app
         must load with the network disconnected, and a smaller published folder is one a
         reviewer can read in full before putting it on a USB stick. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- A d6 showing five, matching the AppImage's icon. SVG rather than PNG because it is text a
         reviewer can read, which is the standard every other file here is held to, and because one
         file covers every size. It replaced the Blazor template's purple logo, which was still
         shipping and told a visitor this was a scaffolded project rather than the tool it is. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="DiceToSeed.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
