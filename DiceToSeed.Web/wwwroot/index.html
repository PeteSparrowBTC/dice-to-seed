<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dice to seed</title>
    <!-- Every asset below is served from this folder. Bootstrap was deleted with the rest of
         the template's third-party assets rather than kept and excluded from checks: the app
         must load with the network disconnected, and a smaller published folder is one a
         reviewer can read in full before putting it on a USB stick. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/DiceToSeed.Ui/css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="DiceToSeed.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
