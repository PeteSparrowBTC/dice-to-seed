<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dice to seed</title>
    <!-- Every asset below is served from this folder. Bootstrap was deleted with the rest of
         the template's third-party assets rather than kept and excluded from checks: the app
         must load with the network disconnected, and a smaller published folder is one a
         reviewer can read in full before putting it on a USB stick. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- A d6 showing five, matching the AppImage's icon. SVG rather than PNG because it is text a
         reviewer can read, which is the standard every other file here is held to, and because one
         file covers every size. It replaced the Blazor template's purple logo, which was still
         shipping and told a visitor this was a scaffolded project rather than the tool it is. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="DiceToSeed.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <!-- What is on screen until the WebAssembly runtime has downloaded and the app takes over.
         It has to exist, because the runtime is several megabytes and a blank window for a few
         seconds looks like a program that failed to start.

         This replaced the Blazor template's two-circle SVG ring, which shipped in every release
         up to 1.3.1 as an unstyled lump: the template's rules for .loading-progress live in the
         template's own app.css, and this app replaced that stylesheet wholesale, so the markup
         arrived with no size, fill or stroke and rendered as a black blob with an empty caption
         under it. A determinate bar is fewer lines than restoring the ring would be, and it is
         markup the repository owns rather than template leftovers.

         The percentage is real: the runtime sets --blazor-load-percentage and
         --blazor-load-percentage-text on the document element as it fetches each resource, so
         the bar and the caption below are driven by actual progress rather than an animation
         that would keep moving if the load had stalled. -->
    <div id="app">
        <div class="boot">
            <p class="boot-title">dice to seed</p>
            <div class="boot-bar"><span></span></div>
            <p class="boot-note">
                Loading. The app runs entirely in this window and makes no network call of its own.
            </p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
