# Publishes a GitHub Release when a v* tag is pushed.
#
# A tag here is a release, and a release is what people will run against real money. Push one
# only when the release commit is already on main through a merged pull request, and only
# deliberately. See CLAUDE.md.
#
# What a release contains, and why each part:
#
#   dice-to-seed-<version>-tails.zip
#                                  the app plus its fingerprint, a checker that refuses to open a
#                                  file that does not match, and instructions for someone who does
#                                  not use a terminal. What to take if you are going to use this.
#   dice-to-seed-<version>-x86_64.AppImage
#                                  the whole app, loose. One file, no server, no port, no browser to
#                                  configure. Verified to run on Tails from the file manager. The
#                                  version is in the name because the AppImage is the file that
#                                  survives on somebody's USB stick, long after SHA256SUMS is gone.
#   roll-sheet-12-words.pdf, roll-sheet-24-words.pdf
#                                  blank sheets to print and write dice rolls on, one per word count,
#                                  plus the same two as .html. They exist so the recorded
#                                  log can be compared against what the dice actually showed. That
#                                  comparison is the only check here that can catch a mis-press:
#                                  every other one compares the log against a second implementation
#                                  of the conversion, and two of those given the same wrong log
#                                  agree perfectly.
#   SHA256SUMS                     covering all three. It proves a file is intact and unaltered on
#                                  the stick. It is not a signature and it travels with the files it
#                                  describes, so it cannot establish that none of them was
#                                  substituted; the tagged run's build log prints the same hashes.
#
# A dice-to-seed-wwwroot.zip used to ship alongside, for running the same app behind
# `python3 -m http.server` in a browser. It was dropped once the AppImage was confirmed working
# on Tails, because it was a second route to the same place with its own instructions, its own
# LibreWolf-not-Tor-Browser proxy caveat and its own port to check. It was also described as the
# artifact "a person can read", which oversold it: the UI and the stylesheet are readable, and
# the derivation is compiled into WebAssembly either way. Reading the app means reading the
# source, and the GitHub Pages demo covers looking at it in a browser.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev librsvg2-dev \
            patchelf build-essential file xvfb xdotool

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tests gate the release. The published vendor vectors are the reason to trust any of
      # this, so a release that has not run them is not a release.
      - name: Test
        run: dotnet test --configuration Release

      - name: Publish the Blazor app
        run: dotnet publish DiceToSeed.Web --configuration Release --output publish

      - name: Check the published app for external references
        run: |
          # An XML namespace name is an identifier, not an address. Nothing ever fetches
          # http://www.w3.org/2000/svg, and favicon.svg cannot leave it out and still parse as SVG.
          # So xmlns values are stripped before the check rather than the whole matching line being
          # excused, which would let a genuine external URL through if it shared a line with a
          # namespace declaration.
          if grep -rIEn "https?://" publish/wwwroot --exclude-dir=_framework \
               | sed -E 's/xmlns(:[a-zA-Z0-9]+)?="https?:\/\/[^"]*"//g' \
               | grep -E "https?://" \
               | grep -vE "127\.0\.0\.1|localhost"; then
            echo "::error::The published app references an external origin."
            exit 1
          fi
          echo "No external references."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Plain cargo, and no tauri-cli. Ported from slip39-backup, which reached this conclusion
      # first and wrote down why: for this configuration the CLI would run a beforeBuildCommand
      # (there is none in tauri.conf.json), check that frontendDist exists (build.rs already fails
      # without it), invoke cargo, and then bundle, which is exactly what --no-bundle existed to
      # switch off. So it reduces to cargo build --release.
      #
      # Measured before removing it, from the 2026-08-22 run: `cargo install tauri-cli --locked` took
      # 5m24s of a 9m job, and recompiled every run, because the cargo cache covers the registry and
      # the target directory but not ~/.cargo/bin. Sixty percent of the job spent compiling a tool
      # that then only called cargo.
      #
      # It also removes a dependency from the supply chain of an artifact people run against real
      # money, and makes CI run the command a person runs locally.
      - name: Build the shell
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package the AppImage
        env:
          APPIMAGETOOL_VERSION: '1.9.1'
          APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
        run: |
          mkdir -p AppDir/usr/bin
          cp src-tauri/target/release/dice-to-seed AppDir/usr/bin/dice-to-seed
          cp packaging/tauri-appimage/AppRun AppDir/AppRun
          cp packaging/tauri-appimage/dice-to-seed.desktop AppDir/dice-to-seed.desktop
          cp packaging/tauri-appimage/dice-to-seed.png AppDir/dice-to-seed.png
          chmod +x AppDir/AppRun AppDir/usr/bin/dice-to-seed

          wget -q "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          # The version goes in the filename, read from the same VERSION file everything else
          # derives from. A downloaded AppImage otherwise carries no clue which release it is:
          # SHA256SUMS says, but only while the two files sit together, and the one that survives
          # on somebody's USB stick is the AppImage. This is also the usual AppImage convention,
          # name-version-arch.
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AppDir "dice-to-seed-$(cat VERSION)-x86_64.AppImage"

      # Proves the artifact runs, which matters more than usual here: this is the first build without
      # the Tauri CLI, and "it compiled" is not the same claim as "it opens a window". A Tauri binary
      # that cannot find a webview stays alive with no window at all, so a process-is-alive check
      # would pass on exactly the failure worth catching. Ported from slip39-backup.
      #
      # WHAT THIS DOES NOT PROVE: that Blazor started inside the webview. A CSP that blocked
      # wasm-unsafe-eval would pass this step and leave an empty window, and the title comes from
      # tauri.conf.json rather than from anything the app renders. So this covers the AppImage
      # mounting, the shell starting, and GTK and WebKitGTK initialising against the library set.
      # What the page does inside it is covered by the suite and by running it on real Tails.
      - name: Smoke test the AppImage under xvfb
        run: |
          set -euo pipefail
          APPIMAGE=$(ls dice-to-seed-*x86_64.AppImage | head -1)
          chmod +x "$APPIMAGE"

          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2

          ./"$APPIMAGE" --appimage-extract-and-run &
          APP_PID=$!

          FOUND=""
          for _ in $(seq 1 30); do
            if xdotool search --name "dice to seed" >/dev/null 2>&1; then
              FOUND=yes
              break
            fi
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 1
          done

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::the AppImage exited on its own before a window appeared"
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          if [ -z "$FOUND" ]; then
            echo "::error::no window titled 'dice to seed' appeared within 30 seconds"
            kill "$APP_PID" "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi

          echo "A window appeared and the process is still running"
          kill "$APP_PID" "$XVFB_PID" 2>/dev/null || true

      # The second artifact, for the person who was handed a stick rather than the person reading
      # this file. Same AppImage, plus its fingerprint, a checker that refuses to launch a file
      # that does not match, and instructions written for someone who does not use a terminal.
      #
      # It exists because the verification the documentation asks for was impossible to perform at
      # the machine where it matters: on Tails, offline, there is no release page to read and no
      # documentation on the stick. Instructions that cannot be followed where they are needed are
      # not instructions.
      #
      # The loose AppImage and SHA256SUMS stay, for anyone verifying independently or scripting
      # against them. The release notes say which of the two to take.
      #
      # Built BEFORE the checksums, so the zip can be covered by them. In 1.3.5 it was built after
      # and the zip therefore shipped with no published hash of its own: anyone wanting to check it
      # before extracting had nothing to check against, which is a poor look on the artifact whose
      # entire purpose is verification.
      - name: Assemble and verify the Tails bundle
        run: |
          chmod +x packaging/tails-bundle/build-bundle.sh
          packaging/tails-bundle/build-bundle.sh \
            "$(ls dice-to-seed-*-x86_64.AppImage | head -1)" "$(cat VERSION)" .

      # The printable roll sheet, shipped as a release asset as well as being served by the app, so
      # it can be reached by a link rather than by finding a file in a repository. It is printed on a
      # networked machine during preparation, because an amnesic offline session is the wrong place to
      # be arranging a printer, and it is blank, so it carries nothing until somebody writes on it.
      - name: Include the printable roll sheet
        run: cp DiceToSeed.Web/wwwroot/roll-sheet-*-words.html DiceToSeed.Web/wwwroot/roll-sheet-*-words.pdf .

      - name: Assemble the release files
        run: |
          # Both artifacts, so either one can be verified on its own. A downloader who took only
          # the zip runs `sha256sum -c --ignore-missing SHA256SUMS`, which checks what is present
          # rather than reporting the file they deliberately did not download as missing.
          sha256sum dice-to-seed-*-x86_64.AppImage dice-to-seed-*-tails.zip roll-sheet-*-words.pdf roll-sheet-*-words.html | tee SHA256SUMS
          ls -lh dice-to-seed-*-x86_64.AppImage dice-to-seed-*-tails.zip roll-sheet-*-words.pdf roll-sheet-*-words.html

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            roll-sheet-12-words.pdf
            roll-sheet-24-words.pdf
            roll-sheet-12-words.html
            roll-sheet-24-words.html
            dice-to-seed-*-tails.zip
            dice-to-seed-*-x86_64.AppImage
            SHA256SUMS
          body: |
            Converts a log of six-sided dice rolls into a BIP-39 seed phrase, offline, as a
            second implementation to check a hardware wallet against.

            ## Which file to download

            **`dice-to-seed-*-tails.zip`** if you are going to use this rather than inspect it,
            and especially if you do not want to touch a terminal. It holds the AppImage, its
            SHA-256, and instructions written for someone standing at an offline Tails machine
            with no other documentation. Extract it in the Files window, copy the folder into
            Home, and double-click `start-here.sh`: it checks the app against its fingerprint and
            refuses to open it if they do not match.

            The loose AppImage and `SHA256SUMS` below are the same app, for verifying by hand or
            scripting against.

            **`roll-sheet-12-words.pdf`** and **`roll-sheet-24-words.pdf`** are blank pages to print
            and write your rolls on, before you boot: one per word count, so the sheet only ever talks
            about the number of throws you are actually making. The `.html` versions are the same
            sheets as readable markup, if you would rather see what you are printing.
            Comparing it against the screen is the only check here that catches pressing the wrong
            button: every other one compares your log against a second tool, and two tools given the
            same wrong log agree perfectly. Destroy it afterwards, it is the wallet in plain text.

            ## Verify before you run it

            ```
            sha256sum -c SHA256SUMS
            ```

            Do this even though you will run it on Tails. Tails decides whether your seed can
            get out; the checksum decides whether the program deriving it is the one published
            here, and a tampered build needs no network to hurt you: it only needs to show you
            words its author can also compute. What the check proves is that the file is intact
            and was not altered on the stick. What it does not prove, since the hash file travels
            with the file it describes and there is no signature, is that neither was substituted.
            For that, compare against the hash printed in this release's public build log.

            To read the app rather than run it, read the source: the conversion is a few hundred
            lines and the suite carries the published Coldcard and SeedSigner vectors. The demo
            build in the browser is for trying it, not for reading it, because the derivation is
            compiled to WebAssembly there as it is here.

            ## On Tails

            ```
            cp dice-to-seed-*-x86_64.AppImage ~/ && cd ~
            chmod +x dice-to-seed-*-x86_64.AppImage
            ./dice-to-seed-*-x86_64.AppImage
            ```

            Copy it off the USB stick first: a stick may be mounted `noexec` and the executable
            bit does not survive a FAT filesystem. Run it from a terminal the first time, since
            GNOME Files does not launch binaries on double-click and does it silently.

            Nothing needs installing. Everything it links against ships with Tails, checked
            against the Tails package manifest rather than assumed.

            ## Check it against something else

            That is the entire point of this app. `TAILS_INSTRUCTIONS.md` lists the cross-checks
            that work offline, including a BIP-39 library you carry rather than install.

            A known answer to test with: fifty 1s give

            ```
            diet glad hat rural panther lawsuit act drop gallery urge where fit
            ```

            which is what Coldcard's own `rolls12.py` produces for the same log.

            ## This app never generates entropy

            No "roll for me", no simulated die, nothing random in the derivation. A test fails
            the build if a source of randomness ever appears in the source.
