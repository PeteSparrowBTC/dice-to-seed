# Publishes the browser build to GitHub Pages as a demonstration.
#
# READ THIS BEFORE CHANGING ANYTHING HERE.
#
# A hosted copy of this app is more dangerous than a hosted copy of a tool that splits a seed
# you already hold. The roll log a user types here IS the seed, in plaintext, before any
# hashing: whoever learns it holds the wallet. Nothing is transmitted (the conversion happens
# entirely in the browser and the app makes no network call), but "nothing is transmitted"
# depends on the served files being the ones in this repository, and a visitor cannot know that
# a server has not swapped them.
#
# So this deployment exists to be tried, not to be used and not to be read. "To be read" was
# claimed here and in the banner, and it was never true: the derivation compiles to WebAssembly, so
# a browser shows what the app does and not how. Reading it means reading the source. That is the
# same overclaim that got dice-to-seed-wwwroot.zip dropped in 1.2.0, made again about the page that
# replaced it.
#
# The reasoning stays in this comment and does NOT go in the banner. It was briefly spelled out
# there, in 1.3.3, and it made a warning about losing a wallet share space with an aside about
# WebAssembly. The banner has one job, which is to stop a real roll log being typed into a web page,
# and every sentence that is not that job competes with it. Say what the page is for, then the
# hazard, then what to do instead. Explanations belong here and in the README.
#
# The app itself
# detects that it is served from something other than 127.0.0.1 or localhost and shows a red
# banner saying so, above the input, before anything can be entered. The decision lives in
# DiceToSeed.Core/ServingOrigin.cs and ServingOriginTests covers it, including the hosts a naive
# check waves through, such as 127.0.0.1.example.com. That behaviour is tested
# and must not be removed: it is the only thing standing between a curious visitor and a real
# roll log typed into a web page.
#
# For real use: download the release, verify its checksum, and run it offline on Tails.

name: pages

# Deploys on a version tag, the same event that publishes the release, so the demo and the
# downloadable release are always the same version.
#
# It used to deploy on every push to main, which meant the demo ran ahead of the newest release as
# soon as anything merged. The page shows its version and commit, so that was visible rather than
# hidden, but visible is not the same as right: someone comparing the demo with the AppImage they
# downloaded could find the two behaving differently and have no way to know which was correct. In
# a tool whose entire method is "two implementations must agree", that is the wrong thing to make
# people wonder about.
#
# The cost is that a broken deploy is discovered at release time rather than at merge time. That is
# covered by ci.yml, which publishes the app and runs the same external-reference check on every
# pull request, so the deploy step is the only part not exercised before a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a running one, so a half-published site cannot be
# left in place.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish DiceToSeed.Web --configuration Release --output publish

      # Pages serves the site from /<repo>/ rather than /, so the base href has to match or
      # every asset request 404s and the app never boots.
      - name: Point the base href at the Pages subpath
        run: |
          sed -i 's|<base href="/" />|<base href="/dice-to-seed/" />|' publish/wwwroot/index.html
          grep -n "base href" publish/wwwroot/index.html

      # A banner welded into the HTML, on top of the one the app renders for itself.
      #
      # The app already detects a non-loopback host and warns, but that warning appears only
      # once WebAssembly has booted, which is several seconds during which the page looks like a
      # working tool. This one is in the markup, so it is on screen from the first paint and
      # survives the runtime failing to load at all. It is not dismissible on purpose: a visitor
      # who types fifty real rolls into a web page has handed over the wallet, and there is no
      # undo for that.
      - name: Weld the demonstration banner into the page
        run: |
          sed -i "/<body>/r packaging/pages/demo-banner.html" publish/wwwroot/index.html
          grep -c "DEMONSTRATION ONLY" publish/wwwroot/index.html

      # Without this, Pages runs the output through Jekyll, which ignores files and folders
      # beginning with an underscore. Blazor keeps its entire runtime in _framework.
      - name: Disable Jekyll
        run: touch publish/wwwroot/.nojekyll

      # The same check the main build runs: nothing served may point at an outside origin.
      - name: Check for external references
        run: |
          # An XML namespace name is an identifier, not an address. Nothing ever fetches
          # http://www.w3.org/2000/svg, and favicon.svg cannot leave it out and still parse as SVG.
          # So xmlns values are stripped before the check rather than the whole matching line being
          # excused, which would let a genuine external URL through if it shared a line with a
          # namespace declaration.
          if grep -rIEn "https?://" publish/wwwroot --exclude-dir=_framework \
               | sed -E 's/xmlns(:[a-zA-Z0-9]+)?="https?:\/\/[^"]*"//g' \
               | grep -E "https?://" \
               | grep -vE "127\.0\.0\.1|localhost"; then
            echo "::error::The published app references an external origin."
            exit 1
          fi
          echo "No external references."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
