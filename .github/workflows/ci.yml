# Continuous integration for dice-to-seed.
#
# This repository generates private keys, so CI has two jobs, not one: prove the conversion
# still agrees with the published vectors, and prove the thing a person would actually put on
# a USB stick is free of outside references.
#
# Deliberately NOT here: an `on: push` workflow that tries to block direct pushes to main.
# Such a workflow runs after the server has already accepted the push, so it can only report,
# never block, and it turns every legitimate merge into a red check. Branch protection is the
# real enforcement; see CLAUDE.md.

name: ci

on:
  # Pull requests into main. This is the gate that matters, because main only ever moves
  # through a pull request.
  pull_request:
    branches: [main]
  # Manual runs, so a maintainer can produce the publishable artifact on demand without
  # opening a pull request first.
  workflow_dispatch:

# Read-only token. Nothing in this workflow writes to the repository, publishes a package or
# creates a release, so nothing needs write access.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The whole solution targets net10.0, the current LTS. global.json is absent on purpose:
      # there is nothing here that needs a pinned patch version, and a stale pin fails builds
      # for reasons unrelated to the code.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The suite carries the complete published BIP-39 English vector set, Coldcard's
      # published dice example, SeedSigner's published 50-roll and 99-roll examples, the
      # wordlist integrity check, and the guard that fails if any source of randomness ever
      # appears in first-party source. A failure here is never "flaky": it means the
      # conversion moved.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish the static app
        run: dotnet publish DiceToSeed.Web --configuration Release --output publish

      # The app must load with the network cable out, so nothing this repository wrote may
      # point at an outside origin.
      #
      # _framework is excluded because it is the .NET WebAssembly runtime, not our code. It
      # contains three strings that look like URLs and are never fetched: aka.ms inside
      # exception text, www.w3.org as XML namespace identifiers, and dotnet.generated.invalid,
      # which uses a reserved TLD that cannot resolve. Scanning it would produce a permanently
      # red check, and a permanently red check gets ignored rather than fixed.
      #
      # Loopback addresses are allowed: the app's own instructions tell the user to serve it
      # on 127.0.0.1, and that instruction is the point.
      - name: Check the published app for external references
        run: |
          echo "Scanning publish/wwwroot, excluding the .NET runtime in _framework"
          if grep -rIEn "https?://" publish/wwwroot --exclude-dir=_framework \
               | grep -vE "127\.0\.0\.1|localhost"; then
            echo "::error::The published app references an external origin. It must load with the network disconnected."
            exit 1
          fi
          echo "No external references."

      # Uploaded so a reviewer can download exactly what would go on a USB stick and check it
      # themselves, rather than taking the build's word for it.
      - name: Upload the publishable output
        uses: actions/upload-artifact@v4
        with:
          name: dice-to-seed-wwwroot
          path: publish/wwwroot
          if-no-files-found: error

  # Packages the desktop shell as a Linux AppImage: one file, double-clicked on Tails, with no
  # web server, no port and no browser to configure. The browser build remains the primary
  # artifact; this is the convenience route.
  #
  # It runs on every pull request rather than only on tags, because the only way to know the
  # Linux build works is to build it, and this repository has no Linux machine to test on
  # otherwise.
  appimage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained: the AppImage carries its own .NET runtime, because Tails has none and
      # installing one is not part of an offline ceremony.
      - name: Publish the desktop shell for Linux
        run: >
          dotnet publish DiceToSeed.Desktop
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output appdir-publish

      # The AppDir layout appimagetool expects: AppRun at the root, a .desktop file and an icon
      # beside it, and the application under usr/.
      - name: Assemble the AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r appdir-publish/* AppDir/usr/bin/
          cp packaging/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/DiceToSeed.Desktop
          cp packaging/appimage/dice-to-seed.desktop AppDir/dice-to-seed.desktop
          cp packaging/appimage/dice-to-seed.png AppDir/dice-to-seed.png
          echo "AppDir assembled:"
          find AppDir -maxdepth 2 | head -20

      # Print what the native library actually links against. This was guesswork once: Debian
      # 13 and Tails ship only webkit2gtk 4.1, so a Photino built against 4.0 would fail on the
      # one platform that matters, and the failure would look like an application bug. Recording
      # it in the build log makes the answer checkable instead of remembered.
      - name: Report the native dependencies
        run: |
          sudo apt-get install -y binutils >/dev/null 2>&1 || true
          echo "Photino.Native.so NEEDED entries:"
          readelf -d AppDir/usr/bin/Photino.Native.so 2>/dev/null | grep NEEDED ||             strings AppDir/usr/bin/Photino.Native.so | grep -E "^lib(webkit|javascriptcore|gtk)" | sort -u

      # appimagetool is the one piece of this build that is neither written here nor produced
      # by the .NET SDK, so it is pinned to a release and its checksum is verified before it is
      # allowed to run. It participates in producing the artifact that derives private keys;
      # fetching an unversioned binary and executing it would contradict everything else this
      # repository does.
      #
      # It comes from AppImage/appimagetool, not AppImage/AppImageKit: the latter's release 13
      # assets are published with an "obsolete-" prefix upstream, and the maintained tool now
      # lives in its own repository on semantic versions.
      #
      # --appimage-extract-and-run because GitHub runners have no FUSE, which appimagetool
      # otherwise requires.
      - name: Build the AppImage
        env:
          APPIMAGETOOL_VERSION: '1.9.1'
          APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir dice-to-seed-x86_64.AppImage
          sha256sum dice-to-seed-x86_64.AppImage | tee dice-to-seed-x86_64.AppImage.sha256
          ls -lh dice-to-seed-x86_64.AppImage

      # The checksum is published beside the binary so that what a person downloads can be
      # compared with what CI built. An unverifiable binary is exactly the thing this
      # repository tells people not to trust.
      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: dice-to-seed-appimage
          path: |
            dice-to-seed-x86_64.AppImage
            dice-to-seed-x86_64.AppImage.sha256
          if-no-files-found: error

