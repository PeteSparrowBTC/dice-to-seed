# Continuous integration for dice-to-seed.
#
# This repository generates private keys, so CI has two jobs, not one: prove the conversion
# still agrees with the published vectors, and prove the thing a person would actually put on
# a USB stick is free of outside references.
#
# Deliberately NOT here: an `on: push` workflow that tries to block direct pushes to main.
# Such a workflow runs after the server has already accepted the push, so it can only report,
# never block, and it turns every legitimate merge into a red check. Branch protection is the
# real enforcement; see CLAUDE.md.

name: ci

on:
  # Pull requests into main. This is the gate that matters, because main only ever moves
  # through a pull request.
  pull_request:
    branches: [main]
  # Manual runs, so a maintainer can produce the publishable artifact on demand without
  # opening a pull request first.
  workflow_dispatch:

# Read-only token. Nothing in this workflow writes to the repository, publishes a package or
# creates a release, so nothing needs write access.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The whole solution targets net10.0, the current LTS. global.json is absent on purpose:
      # there is nothing here that needs a pinned patch version, and a stale pin fails builds
      # for reasons unrelated to the code.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The suite carries the complete published BIP-39 English vector set, Coldcard's
      # published dice example, SeedSigner's published 50-roll and 99-roll examples, the
      # wordlist integrity check, and the guard that fails if any source of randomness ever
      # appears in first-party source. A failure here is never "flaky": it means the
      # conversion moved.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish the static app
        run: dotnet publish DiceToSeed.Web --configuration Release --output publish

      # The app must load with the network cable out, so nothing this repository wrote may
      # point at an outside origin.
      #
      # _framework is excluded because it is the .NET WebAssembly runtime, not our code. It
      # contains three strings that look like URLs and are never fetched: aka.ms inside
      # exception text, www.w3.org as XML namespace identifiers, and dotnet.generated.invalid,
      # which uses a reserved TLD that cannot resolve. Scanning it would produce a permanently
      # red check, and a permanently red check gets ignored rather than fixed.
      #
      # Loopback addresses are allowed: the app's own instructions tell the user to serve it
      # on 127.0.0.1, and that instruction is the point.
      - name: Check the published app for external references
        run: |
          echo "Scanning publish/wwwroot, excluding the .NET runtime in _framework"
          if grep -rIEn "https?://" publish/wwwroot --exclude-dir=_framework \
               | grep -vE "127\.0\.0\.1|localhost"; then
            echo "::error::The published app references an external origin. It must load with the network disconnected."
            exit 1
          fi
          echo "No external references."

      # A per-run artifact for review, not a release asset: it is the static build the AppImage
      # and the Pages demo are both made from, so a reviewer can look at what those contain
      # without extracting an AppImage. What goes on a USB stick is the AppImage.
      - name: Upload the publishable output
        uses: actions/upload-artifact@v4
        with:
          name: dice-to-seed-wwwroot
          path: publish/wwwroot
          if-no-files-found: error

  # Packages the app as a Linux AppImage: one file, double-clicked on Tails, with no web
  # server, no port and no browser to configure.
  #
  # Tauri opens a native window and serves the published Blazor output through an in-process
  # protocol. It hosts the ordinary browser build unmodified, so the desktop artifact is the
  # same wwwroot a reviewer can read rather than a second execution path, and there is no .NET
  # runtime in the bundle: the WebView is the runtime.
  tauri-appimage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux prerequisites, from its own documentation. webkit2gtk 4.1 is the version
      # Tails ships; librsvg is for icon rendering; patchelf is used by the AppImage bundler.
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The frontend is simply the published browser build, unmodified. tauri.conf.json points
      # frontendDist at this folder.
      - name: Publish the Blazor app
        run: dotnet publish DiceToSeed.Web --configuration Release --output publish

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # --no-bundle: Tauri's own bundler copies the whole WebKitGTK and GTK stack in,
      # producing 83 MB. Tails ships those libraries, verified in its package manifest, so the
      # AppImage is assembled below instead and comes out at about 11 MB.
      - name: Build the application
        run: cargo tauri build --no-bundle

      # The same binary, packaged our way: no bundled WebKitGTK, because Tails ships it and
      # bundling a browser engine we know is present triples the size. Built in the same run as
      # Tauri's own bundle so the two are directly comparable rather than compared across runs.
      - name: Package the AppImage
        env:
          APPIMAGETOOL_VERSION: '1.9.1'
          APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
        run: |
          mkdir -p AppDir/usr/bin
          cp src-tauri/target/release/dice-to-seed AppDir/usr/bin/dice-to-seed
          cp packaging/tauri-appimage/AppRun AppDir/AppRun
          cp packaging/tauri-appimage/dice-to-seed.desktop AppDir/dice-to-seed.desktop
          cp packaging/tauri-appimage/dice-to-seed.png AppDir/dice-to-seed.png
          chmod +x AppDir/AppRun AppDir/usr/bin/dice-to-seed

          wget -q "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir dice-to-seed-slim-x86_64.AppImage
          sha256sum dice-to-seed-slim-x86_64.AppImage | tee dice-to-seed-slim-x86_64.AppImage.sha256

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: dice-to-seed-appimage
          path: |
            dice-to-seed-slim-x86_64.AppImage
            dice-to-seed-slim-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Report what was produced
        run: |
          find src-tauri/target -name "*.AppImage" -exec ls -lh {} \;
          echo "--- runtime dependencies of the binary ---"
          BIN=$(find src-tauri/target/release -maxdepth 1 -type f -name "dice-to-seed" | head -1)
          [ -n "$BIN" ] && readelf -d "$BIN" | grep NEEDED || true
